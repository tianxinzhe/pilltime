org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=GBK
android.useAndroidX=true
android.nonTransitiveRClass=true
# 项目路径含非 ASCII 字符，需显式关闭 AGP 路径检查
android.overridePathCheck=true
# 说明：JDK 启动器按系统本地编码读取 Gradle 的 @argfile，
# 守护进程若用 UTF-8 写参数文件，中文路径会被解码成乱码并导致测试类 ClassNotFoundException，
# 因此 file.encoding 需与系统本地编码（中文 Windows 为 GBK）一致。
kotlin.code.style=official
org.gradle.parallel=true